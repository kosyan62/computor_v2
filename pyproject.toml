[project]
name = "computor-v2"
version = "0.1.0"
description = "Interactive math interpreter: exact rationals, complex numbers, matrices, user functions, polynomial equation solving and plotting"
requires-python = ">=3.13"
dependencies = [
    "coverage",
    "matplotlib>=3.10.8",
    "ply",
    "pyqt5>=5.15.11",
    "pytest",
]

[project.scripts]
computor = "computor_v2.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["computor_v2"]

[tool.ruff]
exclude = [
    "parsetab.py",
]

[tool.ruff.lint]
ignore = [
    "E701",   # match-case one-liners: intentional style
    "E402",   # module-level import not at top: R = Rational alias pattern
    "E741",   # ambiguous variable name: l used in list comprehensions
    "BLE001", # blind except: intentional nan/free-var fallbacks in plotter, dispatcher, normalizer
    "S110",   # try-except-pass: same fallback pattern
    "N999",   # module name AST.py: renaming is churn across all imports
    "TRY004", # ValueError in AST args check: caught as parse error in computorv2.add_input
]
